name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "images/**"
      - "requirements.txt"
      - ".github/workflows/pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build PDF
        run: python src/build_pdf.py

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Illustrated_Guide_to_Using_AI
          path: book/Illustrated_Guide_to_Using_AI.pdf
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book
          name: Illustrated Guide to Using AI
          body: |
            Latest picture-book PDF built from `main`.

            Direct download:
            https://github.com/WahrSoft/illustrated-guide-to-using-ai/releases/latest/download/Illustrated_Guide_to_Using_AI.pdf
          files: book/Illustrated_Guide_to_Using_AI.pdf
          make_latest: true
